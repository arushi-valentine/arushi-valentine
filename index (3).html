<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Cute handwritten font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Floating hearts background -->
    <div class="hearts" aria-hidden="true">
      <div class="heart h1"></div>
      <div class="heart h2"></div>
      <div class="heart h3"></div>
      <div class="heart h4"></div>
      <div class="heart h5"></div>
      <div class="heart h6"></div>
      <div class="heart h7"></div>
      <div class="heart h8"></div>
      <div class="heart h9"></div>
      <div class="heart h10"></div>
      <div class="heart h11"></div>
      <div class="heart h12"></div>
    </div>

    <main class="container">
      <section class="card" role="dialog" aria-label="Valentine proposal">
        <h1 class="title">Hi Arushi! <span class="sparkle">💞</span></h1>
        <p class="subtitle">I have a very important question for you…</p>

        <h2 class="question">Will you be my Valentine?</h2>

        <div class="buttons">
          <button id="yesBtn" class="btn yes" type="button">
            Yes! 🥰
          </button>
          <button id="noBtn" class="btn no" type="button">
            No 🙈
          </button>
        </div>

        <p class="hint">Tip: try pressing “No”… if you can 😌</p>

        <div id="successMessage" class="success" role="status" aria-live="polite">
          Yay! I knew you’d say yes! 💖
        </div>

        <div id="sadMessage" class="sad" role="status" aria-live="polite">
          Wait… what?! 😭 My heart is buffering…
        </div>
      </section>
    </main>

    <!-- Celebration Popup -->
    <div id="celebration" class="popup hidden" aria-hidden="true">
      <div class="popup-content">
        <h2>Thank   you   sweetheart ☕💖</h2>

        <!-- Put arushi.jpg in the same folder as these files -->
        <img src="arushi.jpg" alt="Arushi" class="arushi-pic" />

        <button class="btn yes" type="button" onclick="closePopup()">Close</button>
      </div>
    </div>

    <!-- Rain container -->
    <div id="rain-container" aria-hidden="true"></div>

    <script src="script.js"></script>
  </body>
</html>
